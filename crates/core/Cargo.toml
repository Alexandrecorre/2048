[package]
name = "g2048-core"
version.workspace = true
edition.workspace = true

[lib]
name = "g2048_core"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rand_pcg = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
